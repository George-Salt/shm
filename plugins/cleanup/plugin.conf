description.ru=Помогает освободить место в Arch Linux и производных дистрибутивах, включая CachyOS. Проверяет кэш pacman и AUR-менеджеров (включая paru и yay), очищает пользовательские временные файлы, корзину и старые системные журналы после подтверждения.
description.en=Free disk space on Arch Linux and derivatives. Clean package caches, user application caches, trash, and journal entries older than 7 days after confirmation.
