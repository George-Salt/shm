name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash tests/smoke.sh
